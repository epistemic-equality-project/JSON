name: New JSON Submission

on:
  push:
    paths:
      - 'JSON_FILES/*.json'

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read new JSON report
        id: report
        shell: bash
        run: |
          FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep '^JSON_FILES/.*\.json$' \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No JSON file found in this commit."
            exit 1
          fi

          SESSION=$(jq -r '.session.id // "Unknown"' "$FILE")
          LEVEL=$(jq -r '.passwordEvaluation.level // "Unknown"' "$FILE")
          EXPORTED=$(jq -r '.exportedAt // "Unknown"' "$FILE")
          REASONS=$(jq -r '.passwordEvaluation.reasons // [] | join("; ")' "$FILE")

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "exported=$EXPORTED" >> "$GITHUB_OUTPUT"
          echo "reasons=$REASONS" >> "$GITHUB_OUTPUT"

          {
            echo "json<<JSON_EOF"
            cat "$FILE"
            echo "JSON_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send complete JSON email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: GitHub JSON Alert <${{ secrets.GMAIL_USER }}>
          to: ${{ secrets.GMAIL_USER }}
          subject: New JSON Submission - ${{ steps.report.outputs.session }}
          body: |
            NEW JSON SUBMISSION

            SUMMARY

            Session ID:
            ${{ steps.report.outputs.session }}

            Evaluation Level:
            ${{ steps.report.outputs.level }}

            Evaluation Reasons:
            ${{ steps.report.outputs.reasons }}

            Exported At:
            ${{ steps.report.outputs.exported }}

            File:
            ${{ steps.report.outputs.file }}

            Repository:
            ${{ github.server_url }}/${{ github.repository }}

            Commit:
            ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            FULL JSON

            ${{ steps.report.outputs.json }}

            The complete JSON file is also attached.
          attachments: ${{ steps.report.outputs.file }}
